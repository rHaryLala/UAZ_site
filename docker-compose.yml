# Environnement de DÉVELOPPEMENT optionnel (le site se lance aussi sans Docker : voir README.md).
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
#   Site : http://localhost:8080   ·   Back-office : http://localhost:8080/admin   ·   Mails : http://localhost:8025
#
# Le code source est monté dans le conteneur : les modifications PHP/Blade sont prises en compte immédiatement.
# Pour le CSS/JS, `docker compose --profile assets up node` lance Vite avec rechargement à chaud.
services:
    app:
        build:
            context: .
            target: app
        environment:
            APP_ENV: local
            APP_DEBUG: "true"
            APP_URL: http://localhost:8080
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: uaz
            DB_USERNAME: uaz
            DB_PASSWORD: uaz-dev-only
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            QUEUE_CONNECTION: database
            RUN_MIGRATIONS: "false"
        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy

    web:
        image: nginx:1.27-alpine
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    db:
        image: mariadb:11
        environment:
            MARIADB_DATABASE: uaz
            MARIADB_USER: uaz
            MARIADB_PASSWORD: uaz-dev-only
            MARIADB_ROOT_PASSWORD: root-dev-only
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 20

    queue:
        build:
            context: .
            target: app
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        environment:
            APP_ENV: local
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_DATABASE: uaz
            DB_USERNAME: uaz
            DB_PASSWORD: uaz-dev-only
            QUEUE_CONNECTION: database
        volumes:
            - ./:/var/www/html
        depends_on:
            - app

    scheduler:
        build:
            context: .
            target: app
        command: php artisan schedule:work
        environment:
            APP_ENV: local
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_DATABASE: uaz
            DB_USERNAME: uaz
            DB_PASSWORD: uaz-dev-only
        volumes:
            - ./:/var/www/html
        depends_on:
            - app

    mailpit:
        image: axllent/mailpit
        ports:
            - "8025:8025"

    node:
        profiles: ["assets"]
        image: node:22-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host"
        ports:
            - "5173:5173"
        volumes:
            - ./:/var/www/html

volumes:
    db-data:
